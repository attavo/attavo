# Template. Copy this file into your own .github/workflows/ and fill in
# uses: <owner>/attest@<tag> below. Not vendored or executed by attest's
# own repository -- this is the tenant's workflow, not the product's.
#
# An operator comments "/approve" on the work item's PR. This workflow
# checks out the PR's branch, runs `attest approve --by <actor>` (the item
# id is the issue number, not the PR number -- attest derives it from the
# attest/N-* branch), and commits and pushes the resulting approval-NN.json
# -- the push is what binds the approval to a commit.
name: Attest approval

on:
  issue_comment:
    types: [created]

jobs:
  approve:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Resolve the PR's branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })
            core.setOutput('ref', pr.data.head.ref)

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0

      - uses: <owner>/attest@<tag>

      - name: attest approve
        run: attest approve --by "${{ github.event.comment.user.login }}"

      - name: Commit and push the approval record
        run: |
          git config user.name "attest-bot"
          git config user.email "attest-bot@users.noreply.github.com"
          records_rel="$(python3 -c "import tomllib; print(tomllib.load(open('attest.toml','rb'))['paths']['records'])")"
          git add "$records_rel"
          git commit -m "attest: approval record for #${{ github.event.issue.number }}"
          git push origin "HEAD:${{ steps.pr.outputs.ref }}"
