# Template. Copy this file into your own .github/workflows/ and fill in
# uses: <owner>/attavo@<tag> below. Not vendored or executed by Attavo's
# own repository -- this is the tenant's workflow, not the product's.
#
# A merge to main runs `attavo attest`, which derives the merged item from
# the merge commit's own record paths, refuses unless that item's chain
# holds, and writes attestation-NN.json. This workflow then signs that
# record through actions/attest, with the merge commit as subject and
# https://attavo.dev/attestation/v1 as the predicate type this product
# names, and commits and pushes the record -- the push is what binds the
# attestation to the merge it asserts. That push is itself a commit on
# main, so without the skip step below it would retrigger this same
# workflow, forever (issue #9's loop, on this template's own trigger).
# The skip step reads `attavo record-only`'s exit code, the same
# subcommand templates/workflows/attavo-spec-gate.yml calls (issue #19);
# this is the second of the two templates that call it, not a second copy
# of the shell it replaced.
#
# Not every merge is an item merge (issue #58): `attavo attest` exits 0
# and writes nothing when the merge commit names no item, and the
# `attavo attest` step's own record-lookup line must survive that --
# `run:` executes as `bash -e -o pipefail`, under which a bare `grep`
# finding no match exits 1 and fails the step even though "wrote no
# record" is the expected, successful outcome here. The grep is wrapped
# to swallow only its own no-match exit (1), not a real error (any other
# nonzero exit), and every step after it -- computing the subject digest,
# signing, recording the signing outcome, committing and pushing --
# additionally guards on steps.attest.outputs.record being non-empty, the
# same guard shape already used for the record-only skip.
#
# The signing step is refusal-tolerant, not failure-tolerant: it carries
# continue-on-error, and the step after it reads `steps.sign.outcome`
# (unaffected by continue-on-error, unlike `conclusion`) and patches the
# record's signed and signature fields either way, before the record is
# committed. A platform that refuses to sign -- a trial ending, a
# visibility change, a permissions gap -- is reported on the record it
# describes, never routed around by failing the run.
#
# actions/attest signs a sha256 digest, and a git commit is named by
# sha1; there is no file to point subject-path at, since the subject is
# the merge itself, not an artifact it produced. The digest signed here
# is sha256 of the commit sha's own text, which is deterministic and
# reproducible from the sha alone -- gh attestation verify reads it back
# by recomputing the same hash, not by dereferencing a git object.
#
# The push authenticates as a GitHub App installation, not a bot account
# with no login behind it: an app-token step mints an installation token
# from the tenant's own app credentials, checkout uses it for the push,
# and the commit's author and committer are read from the app's own bot
# user at run time, never typed into the template. A push authenticated
# this way is what creates the push run on the record commit -- with the
# skip step above, that run completes instead of retriggering this
# workflow.
name: Attavo attest

on:
  push:
    branches: [main]

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ATTAVO_APP_ID }}
          private-key: ${{ secrets.ATTAVO_APP_PRIVATE_KEY }}

      - name: Resolve the app's bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          login="${{ steps.app-token.outputs.app-slug }}[bot]"
          id="$(gh api "/users/$login" --jq .id)"
          echo "login=$login" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: <owner>/attavo@<tag>

      - name: Skip when the head commit only touches records
        id: touch
        run: attavo record-only && echo skip=true >> "$GITHUB_OUTPUT" || echo skip=false >> "$GITHUB_OUTPUT"

      - name: attavo attest
        id: attest
        if: steps.touch.outputs.skip != 'true'
        run: |
          attavo attest
          record="$(git status --porcelain | awk '{print $2}' | { grep 'attestation-[0-9]*\.json$' || test $? = 1; })"
          echo "record=$record" >> "$GITHUB_OUTPUT"

      - name: Compute the merge commit's subject digest
        id: subject
        if: steps.touch.outputs.skip != 'true' && steps.attest.outputs.record != ''
        run: echo "digest=sha256:$(printf '%s' "${{ github.sha }}" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Sign the attestation record
        id: sign
        if: steps.touch.outputs.skip != 'true' && steps.attest.outputs.record != ''
        continue-on-error: true
        uses: actions/attest@v2
        with:
          subject-name: ${{ github.sha }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          predicate-type: https://attavo.dev/attestation/v1
          predicate-file: ${{ steps.attest.outputs.record }}

      - name: Record the signing outcome
        if: steps.touch.outputs.skip != 'true' && steps.attest.outputs.record != ''
        env:
          RECORD_PATH: ${{ steps.attest.outputs.record }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
          BUNDLE_URL: ${{ steps.sign.outputs.attestation-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os

          path = os.environ["RECORD_PATH"]
          with open(path) as fh:
              rec = json.load(fh)

          if os.environ["SIGN_OUTCOME"] == "success":
              rec["signed"] = True
              rec["signature"] = {"bundle": os.environ["BUNDLE_URL"] or None, "reason": None}
          else:
              rec["signed"] = False
              rec["signature"] = {
                  "bundle": None,
                  "reason": f"signing step did not succeed; see {os.environ['RUN_URL']}",
              }

          with open(path, "w") as fh:
              json.dump(rec, fh, indent=2)
              fh.write("\n")
          PY

      - name: Commit and push the attestation record
        if: steps.touch.outputs.skip != 'true' && steps.attest.outputs.record != ''
        run: |
          git config user.name "${{ steps.bot.outputs.login }}"
          git config user.email "${{ steps.bot.outputs.email }}"
          records_rel="$(python3 -c "import tomllib; print(tomllib.load(open('attavo.toml','rb'))['paths']['records'])")"
          git add "$records_rel"
          git commit -m "attavo: attestation record for ${{ github.sha }}"
          git push origin HEAD:main
