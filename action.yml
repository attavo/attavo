name: "Attavo"
description: "Installs the attavo command, pinned at this tag, on PATH."
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: echo "${{ github.action_path }}/bin" >> "$GITHUB_PATH"
      shell: bash
    - run: |
        ref="${{ github.action_ref }}"
        if [ -z "$ref" ] && [ ! -d "${{ github.action_path }}/.git" ]; then
          ref="$(basename "${{ github.action_path }}")"
        fi
        echo "ATTAVO_PRODUCT_VERSION=$ref" >> "$GITHUB_ENV"
      shell: bash
