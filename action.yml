name: "Attavo"
description: "Installs the attavo command, pinned at this tag, on PATH."
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: echo "${{ github.action_path }}/bin" >> "$GITHUB_PATH"
      shell: bash
    - run: echo "ATTAVO_PRODUCT_VERSION=${{ github.action_ref }}" >> "$GITHUB_ENV"
      shell: bash
