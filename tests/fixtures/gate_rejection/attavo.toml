schema_version = 1

[attavo]
version = "v0.1.0"

[executor]
build = "noop"

[spec]
[spec.boundary]
paths = ["src/**"]

[gates.spec]
command = "ATTAVO_CMD spec-gate"
retires = ["design stage", "second approval"]

[paths]
specs = "specs"
records = "records"
rulings = "rulings.md"
rejections = "rejections"

[operators]
approvers = ["alice"]
